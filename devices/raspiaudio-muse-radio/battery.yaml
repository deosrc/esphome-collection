sensor:
  - platform: adc
    pin: GPIO13
    name: Battery voltage
    id: battery_voltage
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    attenuation: auto
    filters:
      - multiply: 2
      - calibrate_linear:
          - 0.0 -> 0.0
          - 4.58 -> 4.20
      - exponential_moving_average:
          alpha: 0.2
          send_every: 2
      - delta: 0.002
    on_value:
      then:
        - sensor.template.publish:
            id: battery_percent
            state: !lambda "return x;"
  - platform: template
    name: Battery
    id: battery_percent
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    filters:
      - calibrate_polynomial:
          degree: 3
          datapoints:
            - 4.20 -> 100.0
            - 4.13 -> 97.1
            - 4.10 -> 94.2
            - 4.07 -> 88.4
            - 4.05 -> 82.7
            - 4.04 -> 76.9
            - 4.04 -> 71.1
            - 4.01 -> 65.3
            - 3.99 -> 59.5
            - 3.95 -> 53.8
            - 3.93 -> 48.0
            - 3.91 -> 42.2
            - 3.88 -> 36.4
            - 3.86 -> 30.6
            - 3.84 -> 24.9
            - 3.82 -> 19.1
            - 3.76 -> 13.3
            - 3.73 -> 10.4
            - 3.70 -> 7.5
            - 3.64 -> 4.6
            - 3.50 -> 1.7
            - 3.00 -> 0.0
      - lambda: return clamp(x, 0.0f, 100.0f);
