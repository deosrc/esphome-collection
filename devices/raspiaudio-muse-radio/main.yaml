# Based on:
# - https://github.com/tetele/muse-radio-voice-satellite/blob/main/esphome/raspiaudio-radio.yaml
# - https://github.com/RASPIAUDIO/esphomeRadioMusic/blob/main/radio_music.yaml

esphome:
  min_version: 2026.3.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

packages:
  battery: !include battery.yaml
  controls: !include controls.yaml
  audio: !include audio.yaml
  display: !include display.yaml

i2c:
  sda: GPIO18
  scl: GPIO11

spi:
  - clk_pin: GPIO12
    mosi_pin: GPIO8
    interface: hardware

binary_sensor:
  - platform: gpio
    id: usb_plugged
    name: USB plugged in
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
